[project]
name = "glab-927-6-1"
version = "0.1.0"
description = "Customer support FAQ automation and multi-step sequential prompt chains using LangChain and Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.10",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
glab-927-6-1 = "glab_927_6_1:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
